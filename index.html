<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер Цлей & Звичок</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --done-color: #ef4444; /* Червоний хрестик */
            --missed-color: #334155; /* Сірий пропущений */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 10px;
            border: 2px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button.btn-primary {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        button.btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .habit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #334155;
        }

        .habit-title {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .month-name {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-top: 15px;
        }

        .day-label {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 5px;
        }

        .day-box {
            aspect-ratio: 1;
            background: #0f172a;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            position: relative;
            user-select: none;
            transition: transform 0.1s, background-color 0.3s;
            border: 1px solid transparent;
        }

        /* Заблоковані майбутні дні */
        .day-box.disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Сьогоднішній день */
        .day-box.today {
            border-color: var(--accent-color);
        }

        .day-box.today:hover:not(.done) {
            transform: scale(1.05);
        }

        /* Виконаний день (Червоний хрестик) */
        .day-box.done::after {
            content: '✖';
            position: absolute;
            color: var(--done-color);
            font-size: 1.5rem;
            font-weight: 900;
            line-height: 1;
        }

        /* Пропущений день (Сірий) */
        .day-box.missed {
            background-color: var(--missed-color);
            color: #64748b;
        }

        .reset-btn {
            background: transparent;
            border: 1px solid #334155;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .reset-btn:hover {
            color: #ef4444;
            border-color: #ef4444;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Трекер Звичок</h1>

    <div class="input-group" id="setupForm">
        <input type="text" id="habitInput" placeholder="Наприклад: 100 віджимань щодня">
        <button class="btn-primary" onclick="saveHabit()">Старт</button>
    </div>

    <div id="calendarArea" style="display: none;">
        <div class="habit-header">
            <div>
                <div class="habit-title" id="displayTitle">Звичка</div>
                <div class="month-name" id="monthDisplay">Місяць</div>
            </div>
            <button class="reset-btn" onclick="resetHabit()">Скинути</button>
        </div>

        <div class="calendar-grid">
            <div class="day-label">Пн</div>
            <div class="day-label">Вт</div>
            <div class="day-label">Ср</div>
            <div class="day-label">Чт</div>
            <div class="day-label">Пт</div>
            <div class="day-label">Сб</div>
            <div class="day-label">Нд</div>
        </div>

        <div class="calendar-grid" id="daysContainer"></div>
    </div>
</div>

<script>
    let habitData = JSON.parse(localStorage.getItem('habitTrackerData')) || null;

    const now = new Date();
    const currentYear = now.getFullYear();
    const currentMonth = now.getMonth();
    const todayDate = now.getDate();

    function init() {
        if (habitData && habitData.title) {
            document.getElementById('setupForm').style.display = 'none';
            document.getElementById('calendarArea').style.display = 'block';
            document.getElementById('displayTitle').innerText = habitData.title;
            
            const monthNames = ["Січень", "Лютий", "Березень", "Квітень", "Травень", "Червень", "Липень", "Серпень", "Вересень", "Жовтень", "Листопад", "Грудень"];
            document.getElementById('monthDisplay').innerText = `${monthNames[currentMonth]} ${currentYear}`;
            
            renderCalendar();
        } else {
            document.getElementById('setupForm').style.display = 'flex';
            document.getElementById('calendarArea').style.display = 'none';
        }
    }

    function saveHabit() {
        const input = document.getElementById('habitInput');
        if (!input.value.trim()) return;

        habitData = {
            title: input.value.trim(),
            days: {} // Формат: { "1": "done", "2": "missed" }
        };

        localStorage.setItem('habitTrackerData', JSON.stringify(habitData));
        init();
    }

    function renderCalendar() {
        const container = document.getElementById('daysContainer');
        container.innerHTML = '';

        const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        
        // Зміщення для першого дня місяця (0 - Пн, 6 - Нд)
        let firstDayIndex = new Date(currentYear, currentMonth, 1).getDay() - 1;
        if (firstDayIndex === -1) firstDayIndex = 6; 

        // Порожні клітинки до початку місяця
        for (let i = 0; i < firstDayIndex; i++) {
            const emptyBox = document.createElement('div');
            container.appendChild(emptyBox);
        }

        // Рендер днів місяця
        for (let day = 1; day <= daysInMonth; day++) {
            const dayBox = document.createElement('div');
            dayBox.classList.add('day-box');
            dayBox.innerText = day;

            if (day === todayDate) {
                dayBox.classList.add('today');
            }

            // Перевірка статусу з локальної бази
            if (habitData.days[day] === 'done') {
                dayBox.classList.add('done');
            } else if (day < todayDate) {
                // Якщо день минув і не закреслений — він сірий (пропущений)
                dayBox.classList.add('missed');
            } else if (day > todayDate) {
                // Майбутні дні не можна натискати
                dayBox.classList.add('disabled');
            }

            // Клік працює ТІЛЬКИ на сьогоднішній день і тільки якщо він ще не закреслений
            if (day === todayDate) {
                dayBox.onclick = () => markToday(dayBox, day);
            }

            container.appendChild(dayBox);
        }
    }

    function markToday(element, day) {
        if (habitData.days[day] === 'done') return; // Якщо вже закреслено

        habitData.days[day] = 'done';
        element.classList.add('done');
        element.classList.remove('missed');

        localStorage.setItem('habitTrackerData', JSON.stringify(habitData));
    }

    function resetHabit() {
        if (confirm('Скинути цю задачу та весь прогрес?')) {
            localStorage.removeItem('habitTrackerData');
            habitData = null;
            document.getElementById('habitInput').value = '';
            init();
        }
    }

    // Запуск при завантаженні
    init();
</script>

</body>
</html>
