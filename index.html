<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Моє Супер Тренування</title>
    
    <!-- Бібліотеки для салюту та ШІ (TensorFlow.js) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f0c29;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #ff0055;
            --accent-glow: rgba(255, 0, 85, 0.5);
            --success: #00ffcc;
            --text: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* --- Дашборд --- */
        #dashboard {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            font-weight: 900;
            font-size: 2rem;
            text-transform: uppercase;
            background: linear-gradient(to right, var(--success), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .streak-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .streak-fire {
            color: #ff9900;
            text-shadow: 0 0 15px rgba(255, 153, 0, 0.8);
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        .routine-list {
            list-style: none;
            margin-top: 15px;
        }
        .routine-list li {
            font-size: 1.1rem;
            padding: 10px 0;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
        }

        .btn-start {
            width: 100%;
            padding: 20px;
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            border-radius: 15px;
            border: none;
            background: var(--accent);
            color: white;
            box-shadow: 0 0 20px var(--accent-glow);
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-start:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px var(--accent-glow);
        }

        /* --- Календар --- */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-top: 15px;
        }
        .day-cell {
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            background: rgba(0,0,0,0.3);
            font-weight: 700;
            font-size: 0.9rem;
            position: relative;
        }
        .day-cell.missed {
            background: #1a1a1a;
            color: #555;
        }
        .day-cell.today {
            border: 2px solid var(--success);
        }
        .day-cell.completed {
            background: rgba(0, 255, 204, 0.2);
            color: var(--success);
        }
        .day-cell.completed::after {
            content: '🔥';
            position: absolute;
            font-size: 1.2rem;
            opacity: 0.8;
        }

        /* --- Режим Тренування (Камера) --- */
        #workout-ui {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 100;
            flex-direction: column;
        }

        .video-container {
            position: relative;
            flex: 1;
            width: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video, canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        canvas { z-index: 2; }

        .hud {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            width: 90%;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .hud-exercise { font-size: 2rem; font-weight: 900; color: var(--success); }
        .hud-counter { font-size: 5rem; font-weight: 900; line-height: 1; margin-top: 10px; }
        .hud-target { font-size: 1.5rem; color: var(--text-dim); }
        .hud-hint { font-size: 1rem; color: #ffcc00; margin-top: 5px; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 5px;}

        .rest-screen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 20;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .rest-timer { font-size: 6rem; font-weight: 900; color: var(--accent); }

        .btn-cancel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,0,0,0.5);
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 20px;
            font-size: 1.2rem;
            z-index: 10;
        }

        #loading {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            z-index: 30;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- ДАШБОРД -->
    <div id="dashboard">
        <div class="card">
            <h1>Моя Рутина</h1>
            <div class="streak-container">
                <span>Поточна серія:</span>
                <span class="streak-fire" id="streak-display">🔥 0 днів</span>
            </div>
            <ul class="routine-list">
                <li><span>🏋️ Присідання</span> <span>25 разів</span></li>
                <li><span>💪 Віджимання</span> <span>20 разів</span></li>
                <li><span>🔥 Прес</span> <span>25 разів</span></li>
            </ul>
            <button class="btn-start" onclick="startWorkout()">ПОЧАТИ</button>
        </div>

        <div class="card">
            <h2 style="text-align: center; margin-bottom: 10px;">Календар</h2>
            <div id="calendar" class="calendar-grid"></div>
        </div>
    </div>

    <!-- ІНТЕРФЕЙС ТРЕНУВАННЯ -->
    <div id="workout-ui">
        <div class="video-container">
            <video id="video" playsinline autoplay muted></video>
            <canvas id="canvas"></canvas>
            
            <div id="loading">Завантаження камери...<br><small>Зачекай секунду</small></div>

            <div class="hud" id="hud">
                <div class="hud-exercise" id="hud-name">Присідання</div>
                <div class="hud-counter" id="hud-count">0</div>
                <div class="hud-target" id="hud-target">з 25</div>
                <div class="hud-hint" id="hud-hint">Станьте так, щоб було видно все тіло</div>
            </div>

            <div class="rest-screen" id="rest-screen">
                <h2>ПЕРЕРВА</h2>
                <div class="rest-timer" id="rest-timer">30</div>
                <p>Наступне: <span id="next-exercise-name">Віджимання</span></p>
            </div>

            <button class="btn-cancel" onclick="cancelWorkout()">Скасувати</button>
        </div>
    </div>

    <script>
        // --- СТАН ТА ДАНІ ---
        const routine = [
            { id: 'squats', name: 'Присідання', target: 25, hint: 'Станьте на повний зріст. Присідайте глибоко.', startState: 'up' },
            { id: 'pushups', name: 'Віджимання', target: 20, hint: 'Станьте БОКОМ до камери для точного підрахунку.', startState: 'up' },
            { id: 'crunches', name: 'Прес', target: 25, hint: 'Ляжте БОКОМ до камери. Піднімайте тулуб до колін.', startState: 'down' }
        ];

        let history = JSON.parse(localStorage.getItem('workoutHistory')) || [];
        const REST_TIME = 15; 
        
        const getLocalDateStr = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        const todayStr = getLocalDateStr(new Date());

        // --- ВІДОБРАЖЕННЯ ДАШБОРДУ ---
        function updateDashboard() {
            let streak = 0;
            let checkDate = new Date();
            
            if (!history.includes(todayStr)) {
                checkDate.setDate(checkDate.getDate() - 1);
            }

            while (true) {
                if (history.includes(getLocalDateStr(checkDate))) {
                    streak++;
                    checkDate.setDate(checkDate.getDate() - 1);
                } else {
                    break;
                }
            }

            const streakEl = document.getElementById('streak-display');
            streakEl.innerText = streak > 0 ? `🔥 ${streak} днів` : `0 днів`;
            if(streak === 0) streakEl.style.color = '#888';
            else streakEl.style.color = '#ff9900';

            const cal = document.getElementById('calendar');
            cal.innerHTML = '';
            
            const now = new Date();
            const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
            
            for(let i=1; i<=daysInMonth; i++) {
                const iterDateStr = getLocalDateStr(new Date(now.getFullYear(), now.getMonth(), i));
                const isCompleted = history.includes(iterDateStr);
                const isToday = iterDateStr === todayStr;
                const isPast = iterDateStr < todayStr;

                let cls = 'day-cell';
                if(isToday) cls += ' today';
                if(isCompleted) cls += ' completed';
                else if(isPast) cls += ' missed';

                cal.innerHTML += `<div class="${cls}">${isCompleted ? '' : i}</div>`;
            }
        }
        updateDashboard();

        // --- ЛОГІКА ТРЕНУВАННЯ ТА ШІ КАМЕРИ ---
        let detector, cameraRunning = false;
        let currentExerciseIdx = 0;
        let currentCount = 0;
        let exerciseState = 'up'; 
        let isResting = false;
        let timerInterval;

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        async function initAI() {
            if (detector) return;
            document.getElementById('loading').style.display = 'block';
            await tf.setBackend('webgl');
            const model = poseDetection.SupportedModels.BlazePose;
            const detectorConfig = { runtime: 'tfjs', enableSmoothing: true, modelType: 'lite' };
            detector = await poseDetection.createDetector(model, detectorConfig);
            document.getElementById('loading').style.display = 'none';
        }

        async function setupCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'user', width: 640, height: 480 }
            });
            video.srcObject = stream;
            return new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    video.play();
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    resolve();
                };
            });
        }

        async function startWorkout() {
            if(history.includes(todayStr)) {
                if(!confirm("Ти вже тренувався сьогодні! Хочеш повторити? (У статистику не запишеться двічі)")) return;
            }
            
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('workout-ui').style.display = 'flex';
            currentExerciseIdx = 0;
            cameraRunning = true;
            
            await initAI();
            await setupCamera();
            startExerciseLogic();
            requestAnimationFrame(poseDetectionLoop);
        }

        function cancelWorkout() {
            cameraRunning = false;
            clearInterval(timerInterval);
            if(video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
            document.getElementById('workout-ui').style.display = 'none';
            document.getElementById('dashboard').style.display = 'flex';
        }

        function startExerciseLogic() {
            const ex = routine[currentExerciseIdx];
            currentCount = 0;
            exerciseState = ex.startState;
            isResting = false;
            
            document.getElementById('rest-screen').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('hud-name').innerText = ex.name;
            document.getElementById('hud-hint').innerText = ex.hint;
            document.getElementById('hud-target').innerText = `з ${ex.target}`;
            
            updateHUD();
        }

        function updateHUD() {
            document.getElementById('hud-count').innerText = currentCount;
        }

        function completeExercise() {
            currentExerciseIdx++;
            if (currentExerciseIdx >= routine.length) {
                finishFullWorkout();
            } else {
                startRestTimer();
            }
        }

        function startRestTimer() {
            isResting = true;
            document.getElementById('hud').style.display = 'none';
            const restScreen = document.getElementById('rest-screen');
            const restTimeEl = document.getElementById('rest-timer');
            document.getElementById('next-exercise-name').innerText = routine[currentExerciseIdx].name;
            restScreen.style.display = 'flex';

            let timeLeft = REST_TIME;
            restTimeEl.innerText = timeLeft;

            timerInterval = setInterval(() => {
                timeLeft--;
                restTimeEl.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    startExerciseLogic();
                }
            }, 1000);
        }

        function finishFullWorkout() {
            cameraRunning = false;
            if(video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
            document.getElementById('workout-ui').style.display = 'none';
            document.getElementById('dashboard').style.display = 'flex';

            if (!history.includes(todayStr)) {
                history.push(todayStr);
                localStorage.setItem('workoutHistory', JSON.stringify(history));
                confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 } });
            }
            updateDashboard();
        }

        async function poseDetectionLoop() {
            if (!cameraRunning) return;

            if (!isResting) {
                const poses = await detector.estimatePoses(video);
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (poses.length > 0) {
                    const pose = poses[0];
                    drawSkeleton(pose.keypoints);
                    
                    const exId = routine[currentExerciseIdx].id;
                    if (exId === 'squats') countSquats(pose.keypoints);
                    if (exId === 'pushups') countPushups(pose.keypoints);
                    if (exId === 'crunches') countCrunches(pose.keypoints);
                }
            }

            requestAnimationFrame(poseDetectionLoop);
        }

        function countSquats(keypoints) {
            const hip = keypoints[23] || keypoints[24];
            const knee = keypoints[25] || keypoints[26];
            
            if (hip && knee && hip.score > 0.6 && knee.score > 0.6) {
                const distanceY = Math.abs(hip.y - knee.y);
                
                if (distanceY < 50 && exerciseState === 'up') {
                    exerciseState = 'down';
                } else if (distanceY > 100 && exerciseState === 'down') {
                    exerciseState = 'up';
                    currentCount++;
                    updateHUD();
                    if(currentCount >= routine[currentExerciseIdx].target) completeExercise();
                }
            }
        }

        function countPushups(keypoints) {
            const shoulder = keypoints[11] || keypoints[12];
            const elbow = keypoints[13] || keypoints[14];
            
            if (shoulder && elbow && shoulder.score > 0.6 && elbow.score > 0.6) {
                const distanceY = shoulder.y - elbow.y;
                
                if (distanceY > -20 && exerciseState === 'up') {
                    exerciseState = 'down';
                } else if (distanceY < -60 && exerciseState === 'down') {
                    exerciseState = 'up';
                    currentCount++;
                    updateHUD();
                    if(currentCount >= routine[currentExerciseIdx].target) completeExercise();
                }
            }
        }

        function countCrunches(keypoints) {
            const shoulder = keypoints[11] || keypoints[12];
            const hip = keypoints[23] || keypoints[24];
            
            if (shoulder && hip && shoulder.score > 0.6 && hip.score > 0.6) {
                // Відстань між стегном та плечем по осі Y
                const distanceY = hip.y - shoulder.y;
                
                // Коли ми лежимо, плечі і стегна приблизно на одному рівні
                // Коли ми піднімаємось (скручуємось), плечі стають вище за стегна
                if (distanceY > 60 && exerciseState === 'down') {
                    exerciseState = 'up'; // Підняли тулуб
                    currentCount++;
                    updateHUD();
                    if(currentCount >= routine[currentExerciseIdx].target) completeExercise();
                } else if (distanceY < 25 && exerciseState === 'up') {
                    exerciseState = 'down'; // Опустилися назад
                }
            }
        }

        function drawSkeleton(keypoints) {
            ctx.fillStyle = '#00ffcc';
            ctx.strokeStyle = '#ff0055';
            ctx.lineWidth = 2;

            keypoints.forEach(point => {
                if (point.score > 0.5) {
                    ctx.beginPath();
                    const x = canvas.width - point.x;
                    ctx.arc(x, point.y, 5, 0, 2 * Math.PI);
                    ctx.fill();
                }
            });
        }
    </script>
</body>
</html>
