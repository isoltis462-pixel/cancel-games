<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habit Pulse — Premium Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-dark: #080711;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-shine: rgba(255, 255, 255, 0.05);
            --primary: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.4);
            --accent: #ec4899;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --done-color: #ef4444;
            --missed-bg: rgba(255, 255, 255, 0.03);
            --missed-text: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 12px;
            overflow-x: hidden;
            position: relative;
        }

        /* Живий анімований неоновий фон */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: #080711;
        }

        .blob {
            position: absolute;
            filter: blur(90px);
            opacity: 0.6;
            border-radius: 50%;
            animation: moveBlobs 20s infinite alternate cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }

        .blob-1 {
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, #6366f1 0%, transparent 70%);
        }

        .blob-2 {
            bottom: -10%;
            right: -10%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, #ec4899 0%, transparent 70%);
            animation-delay: -5s;
        }

        .blob-3 {
            top: 40%;
            left: 30%;
            width: 40vw;
            height: 40vw;
            background: radial-gradient(circle, #8b5cf6 0%, transparent 70%);
            animation-delay: -10s;
        }

        @keyframes moveBlobs {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(80px, 50px) scale(1.1); }
            100% { transform: translate(-50px, 100px) scale(0.9); }
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 1;
        }

        header {
            text-align: center;
            padding: 10px 0;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 30%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 4px;
        }

        /* Картка додавання */
        .add-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .add-card input {
            flex: 1;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
            width: 100%;
        }

        .add-card input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .btn-add {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-add:active {
            transform: scale(0.95);
        }

        /* Картка звички */
        .habit-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            position: relative;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .habit-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            gap: 10px;
        }

        .habit-info h3 {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            line-height: 1.3;
            word-break: break-word;
        }

        .streak-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #f59e0b;
            background: rgba(245, 158, 11, 0.1);
            padding: 4px 8px;
            border-radius: 20px;
            margin-top: 6px;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .btn-delete {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.2);
        }

        /* Прогрес бар */
        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            margin-bottom: 16px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 10px;
            width: 0%;
            transition: width 0.4s ease;
        }

        /* Дні тижня та сітка */
        .week-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .day-box {
            aspect-ratio: 1;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            color: #cbd5e1;
            position: relative;
            user-select: none;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .day-box.disabled {
            opacity: 0.2;
            cursor: not-allowed;
            border-color: transparent;
        }

        .day-box.today {
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
            color: #fff;
            cursor: pointer;
        }

        .day-box.today:active {
            transform: scale(0.9);
        }

        .day-box.done {
            background: rgba(239, 68, 68, 0.15) !important;
            border-color: rgba(239, 68, 68, 0.4) !important;
            color: transparent !important;
        }

        .day-box.done::after {
            content: '✖';
            position: absolute;
            color: #ef4444;
            font-size: 1.3rem;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
        }

        .day-box.missed {
            background: var(--missed-bg);
            color: var(--missed-text);
            border-color: transparent;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            background: var(--glass-bg);
            border: 1px dashed var(--glass-border);
            border-radius: 20px;
        }
    </style>
</head>
<body>

<div class="ambient-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
</div>

<div class="app-container">
    <header>
        <h1>Habit Pulse</h1>
        <p id="currentMonthText">Трекер досягнень</p>
    </header>

    <!-- Створення нових задач -->
    <div class="add-card">
        <input type="text" id="habitInput" placeholder="Нова ціль (напр. Тренування)..." maxlength="30">
        <button class="btn-add" onclick="addHabit()">+ Додати</button>
    </div>

    <!-- Список усіх звичок -->
    <div id="habitsContainer"></div>
</div>

<script>
    let habits = JSON.parse(localStorage.getItem('habitTracker_multi')) || [];

    const now = new Date();
    const currentYear = now.getFullYear();
    const currentMonth = now.getMonth();
    const todayDate = now.getDate();

    const monthNames = ["Січень", "Лютий", "Березень", "Квітень", "Травень", "Червень", "Липень", "Серпень", "Вересень", "Жовтень", "Листопад", "Грудень"];

    document.getElementById('currentMonthText').innerText = `${monthNames[currentMonth]} ${currentYear}`;

    function saveToStorage() {
        localStorage.setItem('habitTracker_multi', JSON.stringify(habits));
    }

    function addHabit() {
        const input = document.getElementById('habitInput');
        const title = input.value.trim();
        
        if (!title) return;

        const newHabit = {
            id: Date.now(),
            title: title,
            days: {} 
        };

        habits.push(newHabit);
        saveToStorage();
        input.value = '';
        renderHabits();
    }

    function deleteHabit(id) {
        if (confirm('Видалити цю звичку?')) {
            habits = habits.filter(h => h.id !== id);
            saveToStorage();
            renderHabits();
        }
    }

    function calculateStreak(days) {
        let streak = 0;
        for (let d = todayDate; d >= 1; d--) {
            if (days[d] === 'done') {
                streak++;
            } else if (d < todayDate) {
                break;
            }
        }
        return streak;
    }

    function toggleDay(habitId, day) {
        const habit = habits.find(h => h.id === habitId);
        if (!habit) return;

        if (habit.days[day] === 'done') {
            delete habit.days[day];
        } else {
            habit.days[day] = 'done';
            // Ефект салюту при успіху
            confetti({
                particleCount: 50,
                spread: 60,
                origin: { y: 0.8 },
                colors: ['#8b5cf6', '#ec4899', '#ef4444']
            });
        }

        saveToStorage();
        renderHabits();
    }

    function renderHabits() {
        const container = document.getElementById('habitsContainer');
        container.innerHTML = '';

        if (habits.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    Натисни "+ Додати", щоб створити свою першу ціль!
                </div>
            `;
            return;
        }

        const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        let firstDayIndex = new Date(currentYear, currentMonth, 1).getDay() - 1;
        if (firstDayIndex === -1) firstDayIndex = 6;

        habits.forEach(habit => {
            const streak = calculateStreak(habit.days);
            const doneCount = Object.keys(habit.days).filter(d => habit.days[d] === 'done').length;
            const progressPercent = Math.round((doneCount / daysInMonth) * 100);

            const card = document.createElement('div');
            card.className = 'habit-card';

            let daysHTML = '';
            
            // Порожні дні зміщення
            for (let i = 0; i < firstDayIndex; i++) {
                daysHTML += `<div class="day-box disabled" style="visibility:hidden"></div>`;
            }

            // Днів місяця
            for (let day = 1; day <= daysInMonth; day++) {
                let statusClass = '';
                let isClickable = false;

                if (habit.days[day] === 'done') {
                    statusClass = 'done';
                } else if (day < todayDate) {
                    statusClass = 'missed';
                } else if (day > todayDate) {
                    statusClass = 'disabled';
                }

                if (day === todayDate) {
                    statusClass += ' today';
                    isClickable = true;
                }

                const clickAttr = isClickable ? `onclick="toggleDay(${habit.id}, ${day})"` : '';
                
                daysHTML += `<div class="day-box ${statusClass}" ${clickAttr}>${day}</div>`;
            }

            card.innerHTML = `
                <div class="habit-header">
                    <div class="habit-info">
                        <h3>${habit.title}</h3>
                        <div class="streak-tag">🔥 Страйк: ${streak} дн.</div>
                    </div>
                    <button class="btn-delete" onclick="deleteHabit(${habit.id})">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                </div>
                
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" style="width: ${progressPercent}%"></div>
                </div>

                <div class="week-days">
                    <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Нд</div>
                </div>

                <div class="days-grid">
                    ${daysHTML}
                </div>
            `;

            container.appendChild(card);
        });
    }

    // Первинний рендер
    renderHabits();
</script>

</body>
</html>
