<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Моє Супер Тренування</title>
    
    <!-- Бібліотека для салюту -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f0c29;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #ff0055;
            --accent-glow: rgba(255, 0, 85, 0.5);
            --success: #00ffcc;
            --success-glow: rgba(0, 255, 204, 0.4);
            --text: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* --- Дашборд --- */
        #dashboard {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            font-weight: 900;
            font-size: 2rem;
            text-transform: uppercase;
            background: linear-gradient(to right, var(--success), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .streak-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .streak-fire {
            color: #ff9900;
            text-shadow: 0 0 15px rgba(255, 153, 0, 0.8);
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        .routine-list {
            list-style: none;
            margin-top: 15px;
        }
        .routine-list li {
            font-size: 1.1rem;
            padding: 12px 0;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-start {
            width: 100%;
            padding: 20px;
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            border-radius: 15px;
            border: none;
            background: var(--accent);
            color: white;
            box-shadow: 0 0 20px var(--accent-glow);
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-start:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px var(--accent-glow);
        }

        /* --- Календар --- */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-top: 15px;
        }
        .day-cell {
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            background: rgba(0,0,0,0.3);
            font-weight: 700;
            font-size: 0.9rem;
            position: relative;
        }
        .day-cell.missed {
            background: #1a1a1a;
            color: #555;
        }
        .day-cell.today {
            border: 2px solid var(--success);
        }
        .day-cell.completed {
            background: rgba(0, 255, 204, 0.2);
            color: var(--success);
        }
        .day-cell.completed::after {
            content: '🔥';
            position: absolute;
            font-size: 1.2rem;
            opacity: 0.8;
        }

        /* --- Режим Тренування (Інтерактив) --- */
        #workout-ui {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0f0c29, #1b1642);
            z-index: 100;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 20px;
            text-align: center;
        }

        .workout-content {
            margin: auto;
            max-width: 450px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .w-progress {
            font-size: 1.1rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .w-title {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--success);
        }

        .w-target-box {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 20px;
            border-radius: 20px;
            width: 100%;
        }

        .w-target-num {
            font-size: 4rem;
            font-weight: 900;
            color: var(--accent);
        }

        .w-target-label {
            font-size: 1.2rem;
            color: var(--text);
        }

        /* Таймер для планки */
        .plank-timer-display {
            font-size: 5rem;
            font-weight: 900;
            color: var(--success);
            text-shadow: 0 0 20px var(--success-glow);
            margin: 10px 0;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            width: 100%;
        }

        .btn-action {
            flex: 1;
            padding: 20px;
            font-size: 1.3rem;
            font-weight: 900;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-done {
            background: var(--success);
            color: #000;
            box-shadow: 0 0 20px var(--success-glow);
        }
        .btn-done:hover { opacity: 0.9; transform: translateY(-2px); }

        .btn-timer-ctrl {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid var(--glass-border);
        }

        .btn-cancel {
            background: transparent;
            color: var(--text-dim);
            border: none;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- ДАШБОРД -->
    <div id="dashboard">
        <div class="card">
            <h1>Моя Рутина</h1>
            <div class="streak-container">
                <span>Поточна серія:</span>
                <span class="streak-fire" id="streak-display">🔥 0 днів</span>
            </div>
            <ul class="routine-list">
                <li><span>🏋️ Присідання</span> <strong>25 разів</strong></li>
                <li><span>💪 Віджимання</span> <strong>20 разів</strong></li>
                <li><span>🔥 Прес</span> <strong>25 разів</strong></li>
                <li><span>⏱️ Планка</span> <strong>30 сек</strong></li>
            </ul>
            <button class="btn-start" onclick="startWorkout()">ПОЧАТИ ТРЕНУВАННЯ</button>
        </div>

        <div class="card">
            <h2 style="text-align: center; margin-bottom: 10px;">Календар</h2>
            <div id="calendar" class="calendar-grid"></div>
        </div>
    </div>

    <!-- ІНТЕРФЕЙС ТРЕНУВАННЯ -->
    <div id="workout-ui">
        <div class="workout-content">
            <div class="w-progress" id="w-progress">Вправа 1 з 4</div>
            <div class="w-title" id="w-title">Присідання</div>

            <div class="w-target-box" id="reps-box">
                <div class="w-target-num" id="w-target-num">25</div>
                <div class="w-target-label">повторень</div>
            </div>

            <div class="w-target-box" id="timer-box" style="display: none;">
                <div class="plank-timer-display" id="plank-timer">30</div>
                <div class="btn-group">
                    <button class="btn-action btn-timer-ctrl" id="btn-timer-toggle" onclick="togglePlankTimer()">Старт</button>
                    <button class="btn-action btn-timer-ctrl" onclick="resetPlankTimer()">Скинути</button>
                </div>
            </div>

            <button class="btn-action btn-done" onclick="nextExercise()">ГОТОВО ✅</button>
        </div>

        <button class="btn-cancel" onclick="cancelWorkout()">Скасувати тренування</button>
    </div>

    <script>
        const routine = [
            { id: 'squats', name: 'Присідання', target: 25, type: 'reps' },
            { id: 'pushups', name: 'Віджимання', target: 20, type: 'reps' },
            { id: 'crunches', name: 'Прес', target: 25, type: 'reps' },
            { id: 'plank', name: 'Планка', target: 30, type: 'time' }
        ];

        let history = JSON.parse(localStorage.getItem('workoutHistory')) || [];
        const getLocalDateStr = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        const todayStr = getLocalDateStr(new Date());

        let currentIdx = 0;
        let plankSecondsLeft = 30;
        let plankInterval = null;
        let isPlankRunning = false;

        function updateDashboard() {
            let streak = 0;
            let checkDate = new Date();
            
            if (!history.includes(todayStr)) {
                checkDate.setDate(checkDate.getDate() - 1);
            }

            while (true) {
                if (history.includes(getLocalDateStr(checkDate))) {
                    streak++;
                    checkDate.setDate(checkDate.getDate() - 1);
                } else {
                    break;
                }
            }

            const streakEl = document.getElementById('streak-display');
            streakEl.innerText = streak > 0 ? `🔥 ${streak} днів` : `0 днів`;
            if(streak === 0) streakEl.style.color = '#888';
            else streakEl.style.color = '#ff9900';

            const cal = document.getElementById('calendar');
            cal.innerHTML = '';
            
            const now = new Date();
            const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
            
            for(let i=1; i<=daysInMonth; i++) {
                const iterDateStr = getLocalDateStr(new Date(now.getFullYear(), now.getMonth(), i));
                const isCompleted = history.includes(iterDateStr);
                const isToday = iterDateStr === todayStr;
                const isPast = iterDateStr < todayStr;

                let cls = 'day-cell';
                if(isToday) cls += ' today';
                if(isCompleted) cls += ' completed';
                else if(isPast) cls += ' missed';

                cal.innerHTML += `<div class="${cls}">${isCompleted ? '' : i}</div>`;
            }
        }
        updateDashboard();

        function startWorkout() {
            if(history.includes(todayStr)) {
                if(!confirm("Ти вже тренувався сьогодні! Хочеш пройти ще раз?")) return;
            }
            currentIdx = 0;
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('workout-ui').style.display = 'flex';
            loadExercise();
        }

        function cancelWorkout() {
            clearInterval(plankInterval);
            isPlankRunning = false;
            document.getElementById('workout-ui').style.display = 'none';
            document.getElementById('dashboard').style.display = 'flex';
        }

        function loadExercise() {
            clearInterval(plankInterval);
            isPlankRunning = false;
            
            const ex = routine[currentIdx];
            document.getElementById('w-progress').innerText = `Вправа ${currentIdx + 1} з ${routine.length}`;
            document.getElementById('w-title').innerText = ex.name;

            const repsBox = document.getElementById('reps-box');
            const timerBox = document.getElementById('timer-box');

            if (ex.type === 'reps') {
                repsBox.style.display = 'block';
                timerBox.style.display = 'none';
                document.getElementById('w-target-num').innerText = ex.target;
            } else {
                repsBox.style.display = 'none';
                timerBox.style.display = 'block';
                plankSecondsLeft = ex.target;
                document.getElementById('plank-timer').innerText = plankSecondsLeft;
                document.getElementById('btn-timer-toggle').innerText = 'Старт';
            }
        }

        function togglePlankTimer() {
            const btn = document.getElementById('btn-timer-toggle');
            if (isPlankRunning) {
                clearInterval(plankInterval);
                isPlankRunning = false;
                btn.innerText = 'Продовжити';
            } else {
                isPlankRunning = true;
                btn.innerText = 'Пауза';
                plankInterval = setInterval(() => {
                    plankSecondsLeft--;
                    document.getElementById('plank-timer').innerText = plankSecondsLeft;
                    if (plankSecondsLeft <= 0) {
                        clearInterval(plankInterval);
                        isPlankRunning = false;
                        nextExercise(); // Автоматично переходимо далі, коли таймер добіг до 0
                    }
                }, 1000);
            }
        }

        function resetPlankTimer() {
            clearInterval(plankInterval);
            isPlankRunning = false;
            plankSecondsLeft = routine[currentIdx].target;
            document.getElementById('plank-timer').innerText = plankSecondsLeft;
            document.getElementById('btn-timer-toggle').innerText = 'Старт';
        }

        function nextExercise() {
            currentIdx++;
            if (currentIdx >= routine.length) {
                finishWorkout();
            } else {
                loadExercise();
            }
        }

        function finishWorkout() {
            document.getElementById('workout-ui').style.display = 'none';
            document.getElementById('dashboard').style.display = 'flex';

            if (!history.includes(todayStr)) {
                history.push(todayStr);
                localStorage.setItem('workoutHistory', JSON.stringify(history));
                confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 } });
            }
            updateDashboard();
        }
    </script>
</body>
</html>
