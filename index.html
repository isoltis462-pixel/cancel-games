<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Habit Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --accent: #00ffcc;
            --cross-color: #ff3366;
            --missed-bg: #1a1a24;
            --future-opacity: 0.2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(115deg, #1f0033, #001a33, #33001b, #002b2b);
            background-size: 400% 400%;
            animation: meshGradient 15s ease infinite;
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes meshGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            width: 100%;
            max-width: 800px;
            margin-bottom: 30px;
            text-align: center;
            padding: 30px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #00ffcc, #ff3366);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        .input-group {
            display: flex;
            gap: 10px;
            width: 100%;
            position: relative;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        button {
            padding: 15px 25px;
            border-radius: 12px;
            border: none;
            background: var(--accent);
            color: #000;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.6);
        }

        #habits-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .habit-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 25px;
            box-shadow: var(--glass-shadow);
            animation: slideUp 0.4s ease-out forwards;
            position: relative;
            overflow: hidden;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .habit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .habit-title {
            font-size: 1.4rem;
            font-weight: 600;
        }

        .delete-btn {
            background: transparent;
            color: var(--text-muted);
            box-shadow: none;
            padding: 5px 10px;
            font-size: 1.2rem;
            border: 1px solid transparent;
        }

        .delete-btn:hover {
            color: var(--cross-color);
            background: rgba(255, 51, 102, 0.1);
            border-color: var(--cross-color);
            box-shadow: none;
        }

        .gamification-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .streak {
            font-weight: 600;
            color: #ff9900;
            text-shadow: 0 0 10px rgba(255, 153, 0, 0.3);
        }

        .progress-wrapper {
            flex: 1;
            margin-left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .progress-bar {
            flex: 1;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ffcc, #00b3ff);
            width: 0%;
            border-radius: 10px;
            transition: width 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .weekday {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 5px;
        }

        .day-cell {
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            background: rgba(255,255,255,0.08);
            font-weight: 600;
            font-size: 0.9rem;
            position: relative;
            transition: all 0.2s ease;
            user-select: none;
        }

        .day-cell span {
            z-index: 1;
        }

        /* State: Future */
        .day-cell.future {
            opacity: var(--future-opacity);
            background: rgba(0,0,0,0.2);
            cursor: not-allowed;
        }

        /* State: Missed (Past) */
        .day-cell.missed {
            background: var(--missed-bg);
            color: #444;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        /* State: Today */
        .day-cell.today {
            border: 2px solid var(--accent);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2), inset 0 0 10px rgba(0, 255, 204, 0.1);
        }

        .day-cell.today:hover {
            background: rgba(0, 255, 204, 0.15);
            transform: scale(1.05);
        }

        /* State: Completed (Cartoon Cross) */
        .day-cell .cross {
            position: absolute;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--cross-color);
            display: none;
            z-index: 2;
            text-shadow: 2px 2px 0px #000, -1px -1px 0px #fff;
            transform: scale(0);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .day-cell.completed .cross {
            display: block;
            transform: scale(1) rotate(5deg);
        }

        .day-cell.completed span {
            opacity: 0.2;
        }

        @media (max-width: 600px) {
            .input-group {
                flex-direction: column;
            }
            .gamification-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            .progress-wrapper {
                margin-left: 0;
                width: 100%;
            }
            .calendar-grid {
                gap: 5px;
            }
            .day-cell {
                border-radius: 8px;
                font-size: 0.8rem;
            }
            .day-cell .cross {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Premium Tracker</h1>
        <div class="input-group">
            <input type="text" id="habitInput" placeholder="Enter a new habit or goal..." onkeypress="handleEnter(event)">
            <button onclick="addHabit()">+ Add Habit</button>
        </div>
    </header>

    <div id="habits-container"></div>

    <script>
        // State Management
        let habits = JSON.parse(localStorage.getItem('premiumHabits')) || [];

        // Utility: Get standard 'YYYY-MM-DD' string accounting for local timezone
        const getLocalDateString = (dateObj) => {
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const today = new Date();
        const todayStr = getLocalDateString(today);
        const currentYear = today.getFullYear();
        const currentMonth = today.getMonth();

        // Save to localStorage
        const saveHabits = () => {
            localStorage.setItem('premiumHabits', JSON.stringify(habits));
        };

        // Add Habit
        const addHabit = () => {
            const input = document.getElementById('habitInput');
            const name = input.value.trim();
            if (!name) return;

            const newHabit = {
                id: Date.now().toString(),
                name: name,
                completedDates: []
            };

            habits.unshift(newHabit);
            saveHabits();
            input.value = '';
            renderAll();
        };

        // Handle Enter Key
        const handleEnter = (e) => {
            if (e.key === 'Enter') addHabit();
        };

        // Delete Habit
        const deleteHabit = (id) => {
            habits = habits.filter(h => h.id !== id);
            saveHabits();
            renderAll();
        };

        // Toggle Today's Habit Status
        const toggleDay = (id, dateStr) => {
            // Strictly enforce 1-day limit: Only allow toggling today's date
            if (dateStr !== todayStr) return;

            const habit = habits.find(h => h.id === id);
            if (!habit) return;

            const dateIndex = habit.completedDates.indexOf(dateStr);
            let isCompleting = false;

            if (dateIndex === -1) {
                habit.completedDates.push(dateStr);
                isCompleting = true;
            } else {
                habit.completedDates.splice(dateIndex, 1);
            }

            saveHabits();
            renderAll();

            if (isCompleting) {
                triggerConfetti();
            }
        };

        // Confetti Celebration
        const triggerConfetti = () => {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#00ffcc', '#ff3366', '#ffffff']
            });
        };

        // Calculate Streak
        const calculateStreak = (completedDates) => {
            let streak = 0;
            let checkDate = new Date(today);
            
            // If today is not completed, start checking from yesterday
            if (!completedDates.includes(todayStr)) {
                checkDate.setDate(checkDate.getDate() - 1);
            }

            while (true) {
                const checkStr = getLocalDateString(checkDate);
                if (completedDates.includes(checkStr)) {
                    streak++;
                    checkDate.setDate(checkDate.getDate() - 1);
                } else {
                    break;
                }
            }
            return streak;
        };

        // Calculate Monthly Progress
        const calculateProgress = (completedDates, daysInMonth) => {
            let completedThisMonth = 0;
            for (let i = 1; i <= daysInMonth; i++) {
                const d = new Date(currentYear, currentMonth, i);
                if (completedDates.includes(getLocalDateString(d))) {
                    completedThisMonth++;
                }
            }
            return Math.round((completedThisMonth / daysInMonth) * 100);
        };

        // Render Calendar Grid for a Habit
        const renderCalendar = (habit) => {
            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            
            const weekdays = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
            let html = '<div class="calendar-grid">';
            
            weekdays.forEach(day => {
                html += `<div class="weekday">${day}</div>`;
            });

            // Empty slots for padding
            for (let i = 0; i < firstDayIndex; i++) {
                html += `<div></div>`;
            }

            // Days
            for (let i = 1; i <= daysInMonth; i++) {
                const iterDate = new Date(currentYear, currentMonth, i);
                const iterDateStr = getLocalDateString(iterDate);
                const isCompleted = habit.completedDates.includes(iterDateStr);
                
                let classes = 'day-cell';
                let onClick = '';

                // Strip time for exact day comparisons
                const iterDateOnly = new Date(iterDateStr);
                const todayDateOnly = new Date(todayStr);

                if (iterDateStr === todayStr) {
                    classes += ' today';
                    if (isCompleted) classes += ' completed';
                    onClick = `onclick="toggleDay('${habit.id}', '${iterDateStr}')"`;
                } else if (iterDateOnly < todayDateOnly) {
                    if (isCompleted) {
                        classes += ' completed';
                    } else {
                        classes += ' missed';
                    }
                } else {
                    classes += ' future';
                }

                html += `
                    <div class="${classes}" ${onClick}>
                        <span>${i}</span>
                        <div class="cross">✖</div>
                    </div>
                `;
            }

            html += '</div>';
            return { html, daysInMonth };
        };

        // Render Entire UI
        const renderAll = () => {
            const container = document.getElementById('habits-container');
            container.innerHTML = '';

            habits.forEach(habit => {
                const { html: calendarHTML, daysInMonth } = renderCalendar(habit);
                const streak = calculateStreak(habit.completedDates);
                const progress = calculateProgress(habit.completedDates, daysInMonth);

                const card = document.createElement('div');
                card.className = 'habit-card';
                card.innerHTML = `
                    <div class="habit-header">
                        <div class="habit-title">${habit.name}</div>
                        <button class="delete-btn" onclick="deleteHabit('${habit.id}')" title="Delete Habit">✖</button>
                    </div>
                    <div class="gamification-row">
                        <div class="streak">🔥 Streak: ${streak} days</div>
                        <div class="progress-wrapper">
                            <span>Progress</span>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${progress}%"></div>
                            </div>
                            <span>${progress}%</span>
                        </div>
                    </div>
                    ${calendarHTML}
                `;
                container.appendChild(card);
            });
        };

        // Initial Render
        renderAll();

    </script>
</body>
</html>
